name: Release

# Push a tag vX.Y.Z (matching package.json and VERSION) to publish a release.
# HACS installs the attached blood-pressure-card.js from the release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Same zones as validate.yml: day boundaries depend on the time zone.
    strategy:
      matrix:
        tz: [UTC, Europe/Warsaw, America/New_York, Australia/Lord_Howe, Asia/Tokyo]
    name: test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🟢 Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: 🏷️ Check tag matches package.json and VERSION
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: 🔍 Syntax check
        run: node --check blood-pressure-card.js
      - name: 📦 Install dev dependencies
        run: npm ci
      - name: 🧪 Run tests
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📝 Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: 🚀 Create release with the card as asset
        env:
          GH_TOKEN: ${{ github.token }}
        # Fails if the release already exists: a published version is never overwritten.
        run: gh release create "$GITHUB_REF_NAME" blood-pressure-card.js --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
