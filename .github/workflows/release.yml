name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: sed -i "s/export const VERSION = '.*';/export const VERSION = '${GITHUB_REF_NAME#v}';/" blood-pressure-card.js
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" blood-pressure-card.js --clobber
