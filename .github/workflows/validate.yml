name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🟢 Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: 🔍 Syntax check
        run: node --check blood-pressure-card.js
      - name: 📦 Install dev dependencies
        run: npm ci
      - name: 🧪 Run tests
        run: npm test

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🏠 HACS validation
        uses: hacs/action@main
        with:
          category: plugin
